name: Release APK

# Builds the release APK and attaches it to a GitHub Release whenever a version
# tag (v*) is pushed. The asset is always named Kartoonia.apk so the stable link
# https://github.com/ItisMoe/Kartoonia/releases/latest/download/Kartoonia.apk
# always serves the newest build. Can also be run manually from the Actions tab.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # required to create the Release and upload the APK

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Release signing uses the committed keystore (android/app/kartoonia-release.jks
      # + android/key.properties). It is deliberately in the repo so EVERY build —
      # local and CI — is signed with the SAME key; the in-app updater installs
      # release APKs over the running app, which Android only allows when the
      # signature matches. See android/.gitignore for the rationale.
      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK to stable name
        run: cp build/app/outputs/flutter-apk/app-release.apk Kartoonia.apk

      - name: Publish to GitHub Release
        # Only tag pushes create a Release; manual runs just build (a sanity check).
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: Kartoonia.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
